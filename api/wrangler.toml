name = "icebreakers-api"
main = "src/index.ts"
compatibility_date = "2025-09-01"

# Every 5 minutes: post any daily Slack questions that are due.
[triggers]
crons = ["*/5 * * * *"]

# Create with: bunx wrangler d1 create icebreakers  — then paste the id here.
[[d1_databases]]
binding = "DB"
database_name = "icebreakers"
database_id = "8b7ea285-24ae-4bbe-a0a3-b88f585a4c07"
migrations_dir = "migrations"

# Live rooms: one Durable Object per room code, holding its sockets and answers.
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
